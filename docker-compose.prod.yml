services:
  postgres:
    build: ./postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - codex

  redis:
    build: ./redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - codex

  api:
    image: ghcr.io/vitorluuiz/codex-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      CodexApi__ServiceToken: ${API_SERVICE_TOKEN}
      CodexApi__Realtime__RedisConnectionString: "redis:6379,password=${REDIS_PASSWORD}"
      # Login social. Vazio desliga o provedor: a rota responde 501 OAUTH_PROVIDER_NOT_CONFIGURED
      # em vez de quebrar o resto da API, entao da para ligar um provedor de cada vez.
      CodexApi__OAuth__RedirectBaseUrl: ${OAUTH_REDIRECT_BASE_URL:-}
      CodexApi__OAuth__Google__ClientId: ${OAUTH_GOOGLE_CLIENT_ID:-}
      CodexApi__OAuth__Google__ClientSecret: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      CodexApi__OAuth__Microsoft__ClientId: ${OAUTH_MICROSOFT_CLIENT_ID:-}
      CodexApi__OAuth__Microsoft__ClientSecret: ${OAUTH_MICROSOFT_CLIENT_SECRET:-}
      CodexApi__OAuth__GitHub__ClientId: ${OAUTH_GITHUB_CLIENT_ID:-}
      CodexApi__OAuth__GitHub__ClientSecret: ${OAUTH_GITHUB_CLIENT_SECRET:-}
    networks:
      - codex

  realtime:
    image: ghcr.io/vitorluuiz/codex-realtime:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api
      - redis
    environment:
      PORT: 4001
      REALTIME_HOST: 0.0.0.0
      REALTIME_PATH: /realtime
      API_BASE_URL: http://api:8080
      API_SERVICE_TOKEN: ${API_SERVICE_TOKEN}
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-codex_session}
      REALTIME_ALLOWED_ORIGINS: ${REALTIME_ALLOWED_ORIGINS}
    networks:
      - codex

  web:
    image: ghcr.io/vitorluuiz/codex-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api
      - realtime
    environment:
      API_BASE_URL: http://api:8080
      API_SERVICE_TOKEN: ${API_SERVICE_TOKEN}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-codex_session}
    networks:
      - codex

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
      - realtime
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - codex

networks:
  codex:

volumes:
  postgres_data:
  caddy_data:
  caddy_config: