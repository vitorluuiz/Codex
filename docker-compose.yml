services:
  postgres:
    build: ./postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Host 5433 -> container 5432: evita conflito com um Postgres nativo
      # rodando na porta padrao do host. Servicos internos usam postgres:5432
      # (nome do servico), entao isto so afeta acesso via localhost.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - codex

  redis:
    build: ./redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - codex

  api:
    build:
      context: ./.NET
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      CodexApi__ServiceToken: ${API_SERVICE_TOKEN}
      CodexApi__Realtime__RedisConnectionString: "redis:6379,password=${REDIS_PASSWORD}"
    ports:
      - "5282:8080"
    networks:
      - codex

  realtime:
    build: ./realtime
    restart: unless-stopped
    depends_on:
      - api
      - redis
    environment:
      PORT: 4001
      REALTIME_HOST: 0.0.0.0
      REALTIME_PATH: /realtime
      API_BASE_URL: http://api:8080
      API_SERVICE_TOKEN: ${API_SERVICE_TOKEN}
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-codex_session}
      REALTIME_ALLOWED_ORIGINS: ${REALTIME_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "4001:4001"
    networks:
      - codex

  web:
    build:
      context: ./nextjs
      args:
        # NEXT_PUBLIC_* precisa existir no build (fica embutido no bundle do browser),
        # nao adianta so passar em `environment:` — isso so afeta o server em runtime.
        NEXT_PUBLIC_REALTIME_URL: ${NEXT_PUBLIC_REALTIME_URL:-ws://localhost:4001/realtime}
    restart: unless-stopped
    depends_on:
      - api
      - realtime
    environment:
      API_BASE_URL: http://api:8080
      API_SERVICE_TOKEN: ${API_SERVICE_TOKEN}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-codex_session}
    ports:
      - "3000:3000"
    networks:
      - codex

  prometheus:
    image: prom/prometheus:v3.0.1
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - codex

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - codex

networks:
  codex:

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
