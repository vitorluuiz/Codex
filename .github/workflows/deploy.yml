name: Deploy

on:
    push:
        branches: [main]
    workflow_dispatch:

env:
    REGISTRY: ghcr.io
    IMAGE_OWNER: vitorluuiz

permissions:
    contents: read
    packages: write

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                include:
                    - service: web
                      context: ./nextjs
                    - service: api
                      context: ./.NET
                    - service: realtime
                      context: ./realtime
        steps:
            - uses: actions/checkout@v4

            - uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/build-push-action@v6
              with:
                  context: ${{ matrix.context }}
                  push: true
                  build-args: |
                      NEXT_PUBLIC_REALTIME_URL=${{ secrets.NEXT_PUBLIC_REALTIME_URL_PROD }}
                  tags: |
                      ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/codex-${{ matrix.service }}:latest
                      ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/codex-${{ matrix.service }}:${{ github.sha }}

    deploy:
        needs: build-and-push
        runs-on: ubuntu-latest
        steps:
            - uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  script: |
                      echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
                      cd /opt/codex
                      git pull
                      docker compose -f docker-compose.prod.yml pull
                      docker compose -f docker-compose.prod.yml up -d --remove-orphans
